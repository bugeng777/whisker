[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/llm",
    "crates/tools",
    "crates/mcp",
    "crates/ui",
    "crates/cli",
]

[workspace.package]
version = "0.6.1"
edition = "2021"

[workspace.dependencies]
agent-core = { path = "crates/core" }
agent-llm = { path = "crates/llm" }
agent-tools = { path = "crates/tools" }
agent-mcp = { path = "crates/mcp" }
agent-ui = { path = "crates/ui" }

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
regex = "1"
ignore = "0.4"
globset = "0.4"
similar = "3"
crossterm = "0.29"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
shell-words = "1"
toml = "0.8"
dirs = "7"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
url = "2"
unicode-width = "0.2"
base64 = "0.22"

[profile.release]
lto = "thin"
strip = true
