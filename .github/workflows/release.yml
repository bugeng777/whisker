name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z)"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/whisker" "dist/${{ matrix.target }}/whisker"
          files=(README.md config.example.toml)
          if [ -f LICENSE ]; then files+=(LICENSE); fi
          cp "${files[@]}" "dist/${{ matrix.target }}/"
          tar -C "dist/${{ matrix.target }}" -czf "dist/whisker-${{ matrix.target }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: whisker-${{ matrix.target }}
          path: dist/whisker-${{ matrix.target }}.tar.gz

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum whisker-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Update Homebrew and npm metadata
        run: python3 scripts/sync-install-channels.py --version "$RELEASE_TAG" --checksums dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/whisker-*.tar.gz dist/SHA256SUMS install.sh --clobber
          else
            gh release create "$RELEASE_TAG" dist/whisker-*.tar.gz dist/SHA256SUMS install.sh \
              --title "$RELEASE_TAG" --generate-notes
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish npm package
        working-directory: npm/whisker
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is not set; skipping npm publish"
            exit 0
          fi
          if [ -f ../../LICENSE ]; then
            cp ../../LICENSE LICENSE
          fi
          version="${RELEASE_TAG#v}"
          if npm view "@bugeng777/whisker@${version}" version >/dev/null 2>&1; then
            echo "npm version ${version} is already published"
            exit 0
          fi
          npm publish --access public
      - name: Push installer metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmp="$(mktemp -d)"
          cp Formula/whisker.rb "$tmp/whisker.rb"
          cp npm/whisker/checksums.json "$tmp/checksums.json"
          cp npm/whisker/package.json "$tmp/package.json"
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git checkout --force -B main origin/main
          mkdir -p Formula npm/whisker
          cp "$tmp/whisker.rb" Formula/whisker.rb
          cp "$tmp/checksums.json" npm/whisker/checksums.json
          cp "$tmp/package.json" npm/whisker/package.json
          git add Formula/whisker.rb npm/whisker/checksums.json npm/whisker/package.json
          if git diff --cached --quiet; then
            echo "installer metadata already current"
            exit 0
          fi
          git commit -m "Update Homebrew and npm installers to ${RELEASE_TAG}"
          git push origin main
