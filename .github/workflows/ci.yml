name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release
      - name: Validate eval fixtures
        run: python3 eval/run.py --dry-run
      - name: Check install channels
        run: |
          python3 scripts/sync-install-channels.py --check
          node --test npm/whisker/scripts/postinstall.test.js
